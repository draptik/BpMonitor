name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Run markdownlint-cli2
        run: mise run lint:md

  lint-js:
    name: Lint JS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Run Biome
        run: mise run lint:js

      - name: Run TypeScript checkJs
        run: mise run lint:ts

  lint-shell:
    name: Lint Shell
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Run shellcheck
        run: mise run lint:shell

  lint-fsharp:
    name: Lint F#
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: code/dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore
        working-directory: code

      - name: Check formatting
        run: dotnet fantomas --check .
        working-directory: code

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            code/Directory.Packages.props
            code/**/*.fsproj

      - name: Restore dependencies
        run: dotnet restore
        working-directory: code

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: code

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-firefox-${{ runner.os }}-${{ hashFiles('code/Directory.Packages.props') }}

      - name: Install Playwright OS dependencies
        run: pwsh bin/Release/net10.0/playwright.ps1 install-deps chromium firefox
        working-directory: code/BpMonitor.Web.E2E.Tests

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh bin/Release/net10.0/playwright.ps1 install chromium firefox
        working-directory: code/BpMonitor.Web.E2E.Tests

      # Split from E2E so it isn't fighting the rest for CPU, the root cause of past Firefox flakiness.
      # --ignore-exit-code 8 covers each step's expected zero-tests projects (the ones the filter excludes).
      - name: Test (unit/integration)
        run: dotnet test --no-build --configuration Release --filter-not-namespace "BpMonitor.Web.E2E*" --ignore-exit-code 8 --results-directory ./TestResults -- --coverage --coverage-output-format cobertura
        working-directory: code

      # No --coverage: the app runs out-of-process and BpMonitor.TestSupport is
      # ExcludeFromCodeCoverage, so this step's instrumentation covered zero production lines.
      - name: Test (E2E)
        run: dotnet test --no-build --configuration Release --filter-namespace "BpMonitor.Web.E2E*" --ignore-exit-code 8 --results-directory ./TestResults
        working-directory: code

      - name: Upload E2E failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostics
          path: code/TestResults/traces/
          retention-days: 14
          if-no-files-found: ignore

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: "code/TestResults/**/*.cobertura.xml"
          targetdir: "code/CoverageReport"
          reporttypes: "MarkdownSummaryGithub;Badges"

      - name: Write coverage to job summary
        run: cat code/CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Post coverage comment on PR
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request'
        with:
          path: code/CoverageReport/SummaryGithub.md

      - name: Push coverage badge to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          if git fetch origin badges:badges 2>/dev/null; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . 2>/dev/null || true
          fi
          cp code/CoverageReport/badge_linecoverage.svg coverage.svg
          git add coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge"
          git push origin badges --force
