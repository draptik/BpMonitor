name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A new push to a PR supersedes its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs that need more (build-and-test) widen this themselves.
permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - name: Run markdownlint-cli2
        run: mise run lint:md

      - name: Run typos
        run: mise run lint:spelling

      - name: Run Vale
        run: mise run lint:prose

  lint-js:
    name: Lint JS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - name: Run Biome
        run: mise run lint:js

      - name: Run TypeScript checkJs
        run: mise run lint:ts

  lint-shell:
    name: Lint Shell & Actions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - name: Run shellcheck
        run: mise run lint:shell

      - name: Run actionlint
        run: mise run lint:actions

      - name: Run zizmor
        run: mise run lint:actions-security

      - name: Run hadolint
        run: mise run lint:container

  lint-renovate:
    name: Lint Renovate config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - name: Run renovate-config-validator
        run: mise run lint:renovate

  lint-fsharp:
    name: Lint F#
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: code/global.json
          # Fantomas targets net10.0 and doesn't roll forward to the .NET 11 runtime.
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: code/dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore
        working-directory: code

      - name: Check formatting
        run: dotnet fantomas check .
        working-directory: code

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: code/global.json
          cache: true
          cache-dependency-path: |
            code/Directory.Packages.props
            code/**/*.fsproj

      - name: Restore dependencies
        run: dotnet restore
        working-directory: code

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: code

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-firefox-${{ runner.os }}-${{ hashFiles('code/Directory.Packages.props') }}

      - name: Install Playwright OS dependencies
        run: pwsh bin/Release/net11.0/playwright.ps1 install-deps chromium firefox
        working-directory: code/BpMonitor.Web.E2E.Tests

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh bin/Release/net11.0/playwright.ps1 install chromium firefox
        working-directory: code/BpMonitor.Web.E2E.Tests

      # Split from E2E so it isn't fighting the rest for CPU, the root cause of past Firefox flakiness.
      # --ignore-exit-code 8 covers each step's expected zero-tests projects (the ones the filter excludes).
      - name: Test (unit/integration)
        run: dotnet test --no-build --configuration Release --filter-not-namespace "BpMonitor.Web.E2E*" --ignore-exit-code 8 --results-directory ./TestResults -- --coverage --coverage-output-format cobertura
        working-directory: code

      # The app inherits the host's CLR-profiler env vars, so this covers real browser-only lines — dropping it (#513) cost ~3pp coverage.
      - name: Test (E2E)
        run: dotnet test --no-build --configuration Release --filter-namespace "BpMonitor.Web.E2E*" --ignore-exit-code 8 --results-directory ./TestResults -- --coverage --coverage-output-format cobertura
        working-directory: code

      - name: Upload E2E failure diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-diagnostics
          path: code/TestResults/traces/
          retention-days: 14
          if-no-files-found: ignore

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5
        with:
          reports: "code/TestResults/**/*.cobertura.xml"
          targetdir: "code/CoverageReport"
          reporttypes: "MarkdownSummaryGithub;Badges"

      - name: Write coverage to job summary
        run: cat code/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage comment on PR
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request'
        with:
          path: code/CoverageReport/SummaryGithub.md

      # Only main's coverage belongs on the badge; PR runs would overwrite it.
      - name: Push coverage badge to badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          if git fetch origin badges:badges 2>/dev/null; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . 2>/dev/null || true
          fi
          cp code/CoverageReport/badge_linecoverage.svg coverage.svg
          git add coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge"
          git push origin badges --force
