name: Image Scan

# CVEs in the base image layers surface after a release; this reports fixable
# ones in the published image to the repository's Security tab.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    name: Scan published image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          install_args: trivy

      - name: Scan ghcr.io/draptik/bpmonitor-web:latest
        run: >
          trivy image
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --format sarif
          --output trivy.sarif
          ghcr.io/draptik/bpmonitor-web:latest

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
