name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    # No GitHub release for an image the scan blocked.
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: code/global.json

      - name: Publish web single executable
        run: >
          dotnet publish BpMonitor.Web/BpMonitor.Web.fsproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          "-p:Version=${GITHUB_REF_NAME#v}"
          --output ./publish-web
        working-directory: code

      - name: Rename web binary
        run: mv code/publish-web/BpMonitor.Web code/publish-web/bpmonitor-web

      - name: Package web bundle
        run: >
          tar -czf code/bpmonitor-web-linux-x64.tar.gz
          -C code/publish-web bpmonitor-web appsettings.json wwwroot

      - name: Compose release notes
        run: |
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-body.md
          printf '\n' >> release-body.md
          scripts/release-notes.sh "${GITHUB_REF_NAME}" >> release-body.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            code/bpmonitor-web-linux-x64.tar.gz
          body_path: release-body.md
          # Treat tags carrying a pre-release suffix (e.g. v0.1.11-rc1) as
          # prereleases so the /releases/latest API keeps pointing at the last
          # stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-image:
    name: Publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/draptik/bpmonitor-web
          # {{version}} strips the leading "v"; latest=auto adds :latest only
          # for stable (non-pre-release) semver tags.
          tags: |
            type=semver,pattern={{version}}

      # Build into the local daemon first so the scan gates the push.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: code
          file: code/BpMonitor.Web/Containerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          install_args: trivy
          # a release must not restore a cache other runs could have written
          cache: false

      - name: Scan image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: mise run scan:image -- "ghcr.io/draptik/bpmonitor-web:${VERSION}"

      - name: Push image
        run: docker push --all-tags ghcr.io/draptik/bpmonitor-web
