# Prose lint for Markdown docs (`mise run lint:prose`); spelling is typos' job
StylesPath = .vale/styles
MinAlertLevel = warning
# release URL bumped by Renovate (customManagers in renovate.json)
Packages = https://github.com/vale-cli/proselint/releases/download/v0.4.0/proselint.zip

[*.md]
BasedOnStyles = Vale, proselint, BpMonitor
Vale.Spelling = NO
# FP term, not "needless" jargon; "supply" trips PhrasalAdjectivesLy
TokenIgnores = (?i)applicative|supply-chain
# straight quotes are the Markdown/code norm
proselint.CurlyQuotes = NO
