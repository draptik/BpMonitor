# Prose lint for Markdown docs (`mise run lint:prose`); spelling is typos' job
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip

[*.md]
BasedOnStyles = Vale, proselint, BpMonitor
Vale.Spelling = NO
# FP term, not "needless" jargon
TokenIgnores = (?i)applicative
