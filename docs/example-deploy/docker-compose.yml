# Example Docker Compose for running BpMonitor.Web.
#
#   docker compose -f docs/example-deploy/docker-compose.yml up -d
#
# Pulls the prebuilt image from GitHub Container Registry and serves the UI on
# http://localhost:5000. The SQLite database is kept in ./data so it survives
# container recreation. Pin a version by replacing :latest with a release tag.
#
# The app runs as UID 1654, so ./data must be writable by it. Before the first
# start (or when upgrading from an image that ran as root):
#
#   mkdir -p data && sudo chown -R 1654:1654 data

services:
  bpmonitor-web:
    image: ghcr.io/draptik/bpmonitor-web:latest
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    environment:
      - TZ=Europe/Berlin
      # - BpMonitor__RememberMeDays=30  # "remember me" login duration, days (1-400)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "BpMonitor.Web.dll", "--healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
