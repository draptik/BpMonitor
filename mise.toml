[tools]
node = "26.12.0"
biome = "2.4.16"
markdownlint-cli2 = "0.23.3"
shellcheck = "0.11.0"
actionlint = "1.7.12"
hadolint = "2.15.1"
trivy = "0.76.0"
typos = "1.51.1"
vale = "3.24.0"
zizmor = "1.31.1"
lychee = "0.24.2"
"npm:typescript" = "7.0.2"
# @yarnpkg/libzip 3.2.2 was hand-published by Yarn's maintainer without provenance (3.2.0/3.2.1 had it)
"npm:renovate" = { version = "44.131.0", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }

[tasks."lint:md"]
run = 'markdownlint-cli2 "**/*.md"'

[tasks."lint:spelling"]
# config in _typos.toml (en-us locale, so British spellings fail too)
run = "typos"

[tasks."lint:prose"]
# config in .vale.ini; sync fetches the pinned proselint package into .vale/styles (gitignored)
run = ["vale sync", "git ls-files -z '*.md' | xargs -0 vale"]

[tasks."lint:links"]
# config in lychee.toml; needs the network, so it is not part of `mise run lint`
run = "git ls-files -z '*.md' | xargs -0 lychee --no-progress"

[tasks."lint:js"]
run = "biome check"

[tasks."lint:ts"]
# Type-checks the hand-written wwwroot JS via JSDoc (tsconfig.json, checkJs) — no build step
run = "tsc -p tsconfig.json"

[tasks."lint:shell"]
# mirror the CI/hook exclusion of Husky's generated wrapper scripts
run = 'find . -name "*.sh" -not -path "./.husky/_/*" | xargs -r shellcheck'

[tasks."lint:actions"]
# also shellchecks workflow run: scripts via the pinned shellcheck
run = "actionlint"

[tasks."lint:actions-security"]
# config in .github/zizmor.yml; --offline skips the audits that query the GitHub API
run = "zizmor --offline .github/workflows"

[tasks."lint:container"]
run = "hadolint code/BpMonitor.Web/Containerfile"

[tasks."scan:image"]
description = "Fails on fixable CRITICAL/HIGH CVEs in a built image; pass the image ref, e.g. `mise run scan:image -- bpmonitor-web:local`"
run = "trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore.yaml --skip-version-check"

[tasks."lint:renovate"]
env = { RENOVATE_X_IGNORE_RE2 = "true" }  # re2 native build is skipped by mise; RegExp fallback is fine
run = "renovate-config-validator --strict"

[tasks.lint]
depends = ["lint:md", "lint:spelling", "lint:prose", "lint:js", "lint:ts", "lint:shell", "lint:actions", "lint:actions-security", "lint:container", "lint:renovate"]

[tasks.bench]
description = "Runs the BenchmarkDotNet suite (BpMonitor.Benchmarks); pass `-- --job short` for a quick run"
dir = "code"
run = "dotnet run -c Release --project BpMonitor.Benchmarks -- --filter '*'"

[tasks.screenshots]
description = "Regenerates docs/screenshots/*.png from a fresh self-seeded demo instance (run before cutting a release)"
# Builds BpMonitor.Web.E2E.Tests first so its Microsoft.Playwright.dll is present and
# current — the script loads Playwright from there instead of its own version pin.
run = '''
#!/usr/bin/env bash
set -euo pipefail
dotnet build code/BpMonitor.Web.E2E.Tests --configuration Release
dotnet fsi scripts/generate-screenshots.fsx
'''

[tasks."test:scripts"]
description = "Tests for the dev tooling shell scripts in scripts/"
run = ["scripts/check-pr-body.test.sh", "scripts/ship-pr.test.sh", "scripts/cut-release.test.sh"]

[tasks."test:e2e-setup"]
description = "One-time local setup: installs the Playwright Chromium and Firefox browsers used by BpMonitor.Web.E2E.Tests"
dir = "code"
run = '''
#!/usr/bin/env bash
set -euo pipefail
dotnet build BpMonitor.Web.E2E.Tests --configuration Release
output_dir="$(pwd)/BpMonitor.Web.E2E.Tests/bin/Release/net11.0"
if command -v pwsh >/dev/null 2>&1; then
  pwsh "$output_dir/playwright.ps1" install chromium firefox
else
  tmp_fsx=$(mktemp --suffix=.fsx)
  cat > "$tmp_fsx" <<EOF
#r "$output_dir/Microsoft.Playwright.dll"
Microsoft.Playwright.Program.Main([| "install"; "chromium"; "firefox" |]) |> ignore
EOF
  dotnet fsi "$tmp_fsx"
  rm -f "$tmp_fsx"
fi
'''
